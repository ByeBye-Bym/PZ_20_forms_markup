<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Регистрация</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Регистрация на прогулку</h1>
      <form class="form" action="#" method="post">
        <div class="form__field">
          <label>Имя</label><input type="text" placeholder="Введите имя" />
        </div>
        <div class="form__field">
          <label>Email</label
          ><input type="text" placeholder="name@example.com" />
        </div>
        <fieldset>
      <legend>Выберите время</legend>
      <label>
      <input type="radio" name="time" value="10"> 10:00
      </label>
      <label>
      <input type="radio" name="time" value="18"> 18:00
      </label>
      </fieldset>
      <label>
      <input type="checkbox" name="agree" required>
       Я согласен с условиями использования
      </label>
      <label type="checkbox" name="agree" required>
       <select id="route" name="route">
        <option value="center">по историческим местам</option>
        <option value="center">на параходе</option>
        <option value="center">по лесу</option>
       </select>
       <textarea id="comment" name="comment"></textarea>
      </label>
      <button type="submit">
          Записаться
        </button>
      </form>
    </main>
  </body>
</html>
